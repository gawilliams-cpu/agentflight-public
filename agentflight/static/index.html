function airportMap(a) {
  if (!a.map) return "";
  if (!assetUrl("maps/")) return '<div class="ref-map ref-photo__none">Map: shown in the live app</div>';
  const W = 260, H = 190, [px, py] = a.map.pin;
  const left = Math.max(0, Math.min(512 - W, px - W / 2)), top = Math.max(0, Math.min(512 - H, py - H / 2));
  const tiles = a.map.tiles.map((f) => {
    const [dx, dy] = f.slice(-6, -4).split("").map(Number);
    return `<img src="${assetUrl("maps/" + f)}" alt="" style="left:${dx * 256 - left}px;top:${dy * 256 - top}px">`;
  }).join("");
  return `<div class="ref-map" style="width:${W}px;height:${H}px" aria-label="Map of ${esc(a.name)}">${tiles}
    <span class="ref-pin" style="left:${px - left}px;top:${py - top}px"></span>
    <a class="ref-map__credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></div>`;
}

/* ---- Schedule board: the week by aircraft or by pilot, as a 3-day timeline or a week grid ------ */
const BOARD_HOURS = [5, 23];   // the timeline shows 05:00–23:00 each day; nights are folded away
const KIND_CLASS = { client: "k-client", positioning: "k-pos", maintenance: "k-mx", standby: "k-standby", proposed: "k-prop" };

async function renderSchedule(kind, id) {
  const board = await api.schedule();
  const b = (ui.board ||= { view: "3day", by: "aircraft", start: board.today, aircraft: "", pilot: "", client: "", trip: "" });
  if (kind && id && ui.boardLink !== `${kind}/${id}`) {   // arriving from a link: show what it points at
    ui.boardLink = `${kind}/${id}`;
    Object.assign(b, { aircraft: "", pilot: "", client: "", trip: "" });
    if (kind === "aircraft") Object.assign(b, { by: "aircraft", aircraft: id });
    if (kind === "pilot") Object.assign(b, { by: "pilot", pilot: id });
    if (kind === "trip") {
      const first = board.aircraft.flatMap((r) => r.items).filter((i) => i.trip === id).sort((x, y) => x.start.localeCompare(y.start))[0];
      Object.assign(b, { by: "aircraft", view: "3day", trip: id,
        start: first ? Math.min(4, Math.max(0, board.days.findIndex((d) => d.date === first.start.slice(0, 10)))) : b.start });
    }
  }
  const rows = (b.by === "aircraft" ? board.aircraft.filter((r) => !b.aircraft || r.id === b.aircraft)
                                    : board.pilots.filter((r) => !b.pilot || r.id === b.pilot));
  const days = b.view === "week" ? board.days : board.days.slice(b.start, b.start + 3);
  const option = (value, text, current) => `<option value="${esc(value)}"${value === current ? " selected" : ""}>${esc(text)}</option>`;
  $("view").innerHTML = `
    <div class="trip-head"><h1>Schedule</h1></div>
    <div class="filters board-controls">
      <div class="segmented"><button data-board="view:3day" class="${b.view === "3day" ? "on" : ""}">3 days</button><button data-board="view:week" class="${b.view === "week" ? "on" : ""}">Week</button></div>
      <div class="segmented"><button data-board="by:aircraft" class="${b.by === "aircraft" ? "on" : ""}">By aircraft</button><button data-board="by:pilot" class="${b.by === "pilot" ? "on" : ""}">By pilot</button></div>
      ${b.view === "3day" ? `<span class="board-range"><button class="btn" data-board="step:-1" ${b.start === 0 ? "disabled" : ""} aria-label="Earlier">‹</button>
        <span class="num">${esc(days[0].label)} – ${esc(days[days.length - 1].label)}</span>
        <button class="btn" data-board="step:1" ${b.start >= 4 ? "disabled" : ""} aria-label="Later">›</button></span>`
        : `<span class="num muted">${esc(days[0].label)} – ${esc(days[6].label)}</span>`}
      ${b.by === "aircraft" ? `<select data-filter="aircraft" aria-label="Aircraft">${option("", "All aircraft", b.aircraft)}${board.aircraft.map((r) => option(r.id, `${r.title} · ${r.subtitle}`, b.aircraft)).join("")}</select>`
        : `<select data-filter="pilot" aria-label="Pilot">${option("", "All pilots", b.pilot)}${board.pilots.map((r) => option(r.id, r.title, b.pilot)).join("")}</select>`}
      <select data-filter="client" aria-label="Client">${option("", "All clients", b.client)}${board.clients.map((c) => option(c.id, c.company, b.client)).join("")}</select>
      ${b.trip ? `<span class="board-chip">Trip ${esc(b.trip)} <button data-board="trip:" aria-label="Clear">×</button></span>` : ""}
    </div>
    <p class="muted board-note">The demo week, fixed. The full app would let you pick any dates.</p>
    <div id="board"></div>
    <div class="board-legend">
      <span><i class="k-client"></i>Client flight</span><span><i class="k-pos"></i>Positioning</span>
      <span><i class="k-mx"></i>Maintenance</span>${b.by === "pilot" ? '<span><i class="k-standby"></i>Standby</span><span><i class="k-duty"></i>Duty day (report to release)</span>' : ""}
      <span><i class="k-prop"></i>Proposed, waiting for your approval</span><span><i class="k-now"></i>Now (demo clock)</span>
    </div>`;
  const narrow = window.matchMedia("(max-width: 700px)").matches;
  if (narrow) boardList(rows, days, board, b);
  else if (b.view === "week") boardWeek(rows, days, board, b);
  else boardTimeline(rows, days, board, b);

  document.querySelectorAll("[data-board]").forEach((el) => el.addEventListener("click", () => {
    const [key, value] = el.dataset.board.split(":");
    if (key === "step") b.start = Math.min(4, Math.max(0, b.start + Number(value)));
    else b[key] = value;
    renderSchedule();
  }));
  document.querySelectorAll("[data-filter]").forEach((el) => el.addEventListener("change", () => { b[el.dataset.filter] = el.value; renderSchedule(); }));
}

const dimmed = (item, b) => (b.client && item.client !== b.client) || (b.trip && item.trip !== b.trip);
const itemHref = (item) => (item.trip ? `#/trips/${encodeURIComponent(item.trip)}` : null);
const itemTitle = (item) => `${item.start.slice(11)}–${item.end.slice(11)} ${item.label}${item.note ? ` (${item.note})` : ""}${item.trip ? ` · trip ${item.trip}` : ""}`;

/* 3 days, drawn to scale. A label sits inside its bar when it fits, otherwise above or below it,
   on whichever line is free; a proposed move gets its own lane under the flight it replaces. */
function boardTimeline(rows, days, board, b) {
  const [h0, h1] = BOARD_HOURS, span = h1 - h0;
  const x = (iso) => {
    const d = days.findIndex((day) => day.date === iso.slice(0, 10));
    if (d < 0) return null;
    const hour = Math.min(h1, Math.max(h0, Number(iso.slice(11, 13)) + Number(iso.slice(14, 16)) / 60));
    return ((d * span + hour - h0) / (days.length * span)) * 100;
  };
  const grid = days.map((_, d) => `<div class="tl-day" style="left:${(d / days.length) * 100}%"></div>`
    + [12, 18].map((hh) => `<div class="tl-tick" style="left:${((d * span + hh - h0) / (days.length * span)) * 100}%"></div>`).join("")).join("");
  const head = days.map((day, d) => `<span class="tl-dl" style="left:calc(${(d / days.length) * 100}% + 6px)">${esc(day.label)}</span>`
    + [6, 12, 18].map((hh) => `<span class="tl-hl" style="left:${((d * span + hh - h0) / (days.length * span)) * 100}%">${String(hh).padStart(2, "0")}</span>`).join("")).join("");
  const nowX = x(board.now);
  const inWindow = (i) => x(i.start) !== null || x(i.end) !== null;
  $("board").innerHTML = `<div class="tl">
    <div class="tl-row tl-head"><div class="tl-label"></div><div class="tl-track">${grid}${head}</div></div>
    ${rows.map((r, n) => {
      const tall = r.items.some((i) => i.kind === "proposed" && inWindow(i));
      const duty = (r.duty || []).filter((d) => x(d.start) !== null).map((d) =>
        `<div class="tl-duty" style="left:${x(d.start)}%;width:${x(d.end) - x(d.start)}%" title="${esc(d.label)}"><span>${esc(d.label)}</span></div>`).join("");
      return `<div class="tl-row"><div class="tl-label"><b>${esc(r.title)}</b><small>${esc(r.subtitle)}</small></div>
        <div class="tl-track${tall ? " tall" : ""}${r.duty ? " pilot" : ""}" id="tl-${n}">${grid}${duty}
          ${nowX !== null ? `<div class="tl-now" style="left:${nowX}%"></div>` : ""}</div></div>`;
    }).join("")}
    ${rows.length ? "" : '<div class="muted" style="padding:14px">Nothing matches these filters.</div>'}</div>`;

  const ruler = document.createElement("span");
  ruler.className = "tl-cap";
  ruler.style.visibility = "hidden";
  $("board").appendChild(ruler);
  const textWidth = (text) => { ruler.textContent = text; return ruler.offsetWidth + 8; };
  rows.forEach((r, n) => {
    const track = $("tl-" + n), W = track.clientWidth, lanes = { up: -1, dn: -1 };
    const html = [];
    for (const item of r.items.filter(inWindow)) {
      const left = x(item.start) ?? 0, right = x(item.end) ?? 100, width = Math.max(right - left, 0.8);
      const href = itemHref(item), tag = href ? "a" : "div", fade = dimmed(item, b) ? " faded" : "";
      const hl = b.trip && item.trip === b.trip ? " hl" : "";
      const bar = `<${tag} class="tl-bar ${KIND_CLASS[item.kind]}${fade}${hl}"${href ? ` href="${href}"` : ""} style="left:${left}%;width:${width}%" title="${esc(itemTitle(item))}"></${tag}>`;
      html.push(bar);
      const tw = textWidth(item.label), px = (left / 100) * W, bw = (width / 100) * W;
      if (item.kind === "proposed") {   // its own lane, label to the left of the dashed bar
        const at = Math.max(0, Math.min(px - tw - 4, W - tw));
        html.push(`<span class="tl-cap prop${fade}" style="left:${at}px">${esc(item.label)}</span>`);
        continue;
      }
      if (tw <= bw) { html.push(`<span class="tl-in ${KIND_CLASS[item.kind]}-t${fade}" style="left:${left}%">${esc(item.label)}</span>`); continue; }
      const start = Math.max(0, Math.min(px, W - tw));
      const below = track.classList.contains("tall") ? Infinity : lanes.dn;   // a proposal's lane is reserved
      const lane = lanes.up < start ? "up" : below < start ? "dn" : "up";
      lanes[lane] = start + tw;
      html.push(`<span class="tl-cap ${lane}${fade}" style="left:${start}px">${esc(item.label)}</span>`);
    }
    track.insertAdjacentHTML("beforeend", html.join(""));
  });
  ruler.remove();
}

/* The week: one cell per row and day, holding that day's items in time order. */
function boardWeek(rows, days, board, b) {
  const today = board.now.slice(0, 10);
  $("board").innerHTML = `<div class="wk" style="grid-template-columns:150px repeat(${days.length}, minmax(0, 1fr))">
    <div class="wk-h"></div>${days.map((d) => `<div class="wk-h${d.date === today ? " today" : ""}">${esc(d.label)}${d.date === today ? `<small>now ${esc(board.now.slice(11))}</small>` : ""}</div>`).join("")}
    ${rows.map((r) => `<div class="wk-row"><b>${esc(r.title)}</b><small>${esc(r.subtitle)}</small></div>` + days.map((d) => {
      const duty = (r.duty || []).find((x) => x.start.startsWith(d.date));
      return `<div class="wk-c${d.date === today ? " today" : ""}">${r.items.filter((i) => i.start.startsWith(d.date)).map((i) => {
        const href = itemHref(i), tag = href ? "a" : "div";
        return `<${tag} class="wk-chip ${KIND_CLASS[i.kind]}${dimmed(i, b) ? " faded" : ""}${b.trip && i.trip === b.trip ? " hl" : ""}"${href ? ` href="${href}"` : ""} title="${esc(itemTitle(i))}"><b>${esc(i.time)}</b> ${esc(i.kind === "proposed" ? "proposed" : i.label)}</${tag}>`;
      }).join("")}${duty ? `<div class="wk-duty">${esc(duty.label)}</div>` : ""}</div>`;
    }).join("")).join("")}</div>`;
}

/* Phones: a list by day. */
function boardList(rows, days, board, b) {
  $("board").innerHTML = days.map((d) => {
    const items = rows.flatMap((r) => r.items.filter((i) => i.start.startsWith(d.date)).map((i) => ({ ...i, row: r.title })))
      .sort((x, y) => x.start.localeCompare(y.start));
    return `<div class="record board-day"><div class="section-label">${esc(d.label)}</div>${items.length ? items.map((i) => {
      const href = itemHref(i), tag = href ? "a" : "div";
      return `<${tag} class="board-li${dimmed(i, b) ? " faded" : ""}"${href ? ` href="${href}"` : ""}><span class="wk-chip ${KIND_CLASS[i.kind]}"><b>${esc(i.time)}</b></span><span><b>${esc(i.row)}</b> ${esc(i.label)}</span></${tag}>`;
    }).join("") : '<div class="muted">Nothing scheduled.</div>'}</div>`;
  }).join("");
}

/* ---- Router and live updates -------------------------------------------------------------------- */
function route() {
  const hash = location.hash || "#/";
  api.overview().then(renderHeader).catch(() => {});   // the clock and the agent strip, on every page
  const trip = hash.match(/^#\/trips\/([^/]+)$/);
  const change = hash.match(/^#\/changes\/([^/]+)$/);
  if (!trip || (ui.chat && ui.chat.trip && ui.chat.trip !== decodeURIComponent(trip[1]))) closeChat();
  $("tabEvals").classList.toggle("on", hash.startsWith("#/evals"));
  $("tabReference").classList.toggle("on", hash.startsWith("#/reference"));
  $("tabSchedule").classList.toggle("on", hash.startsWith("#/schedule"));
  $("tabTrips").classList.toggle("on", !["#/evals", "#/reference", "#/schedule"].some((p) => hash.startsWith(p)));
  if (hash.startsWith("#/evals")) return renderEvals();
  const schedule = hash.match(/^#\/schedule(?:\/([^/]+)\/([^/]+))?$/);
  if (schedule) return renderSchedule(schedule[1], schedule[2] && decodeURIComponent(schedule[2]));
  const reference = hash.match(/^#\/reference(?:\/([^/]+))?(?:\/([^/]+))?$/);
  if (reference) return renderReference(reference[1], reference[2] && decodeURIComponent(reference[2]));
  if (trip) return renderTrip(decodeURIComponent(trip[1]));
  if (change) return renderUnmatched(change[1]);
  ui.seenRows = null;
  return renderTrips();
}

async function renderUnmatched(changeId) {
  // A request the agent couldn't tie to one trip: the same card, on its own page.
  const [overview, card] = await Promise.all([api.overview(), api.change(changeId)]);
  renderHeader(overview);
  ui.open[card.id] = true;
  $("view").innerHTML = `<a class="back" href="#/">← Trips</a>
    <div class="trip-head"><h1>Trip unclear · ${esc(card.email.from || "")}</h1></div>
    <p class="trip-meta">The agent couldn't tell which trip this email is about, so it is asking.</p>
    <h2>Needs your decision</h2>${decisionCard(card)}`;
  wire({ trip: null, decisions: [card] }, () => renderUnmatched(changeId));
}

let pending = null;
function refreshSoon() {
  // Don't redraw under someone typing a message edit; catch up when they leave the field.
  const active = document.activeElement;
  if (active && active.matches("textarea, input:not([type=checkbox])") && $("view").contains(active)) {
    active.addEventListener("blur", refreshSoon, { once: true });
    return;
  }
  clearTimeout(pending);
  pending = setTimeout(() => {
    const hash = location.hash || "#/";
    if (hash === "#/" || hash === "#") renderTrips(); else route();
  }, 120);
}

function onLiveEvent(event) {
  if (event.type === "step") {
    // One line per tool: "Checking crew duty…" becomes its result when the result arrives.
    const steps = (ui.liveSteps[event.change] ||= []);
    const last = steps[steps.length - 1];
    if (event.kind === "step") { steps.push({ text: event.text + "…", state: "live" }); (ui.stepNow ||= {})[event.change] = event.text; }
    else if (last && last.state === "live" && event.kind === "check") Object.assign(last, { text: event.text, state: event.ok === false ? "fail" : "check" });
    else if (last && last.state === "live" && event.kind === "read") Object.assign(last, { text: last.text.replace(/…$/, ""), state: "read" });
    else if (event.kind === "proposal" || event.kind === "note") steps.push({ text: event.text, state: event.kind });
    refreshSoon();
    return;
  }
  if (event.type === "eval") { if ((location.hash || "").startsWith("#/evals")) refreshSoon(); return; }
  if (event.type === "reset") { Object.assign(ui, { open: {}, msgOpen: {}, msgOff: {}, edits: {}, rejecting: {}, prefill: {}, liveSteps: {} }); }
  refreshSoon();
}

async function setUpDemo() {
  try {
    const inbox = await api.inbox();
    $("demoMessage").innerHTML = inbox.map((m) => `<option value="${esc(m.id)}">${esc(m.id)} · ${esc(m.subject)}</option>`).join("");
  } catch { $("demo").hidden = true; }
  $("deliver").onclick = async () => {
    try { await api.deliver($("demoMessage").value); toast("Email delivered to the ops inbox."); }
    catch (error) { toast(error.message); }
  };
  $("reset").onclick = async () => { await api.reset(); location.hash = "#/"; toast("Reset to the base week."); };
}

window.addEventListener("hashchange", route);
window.addEventListener("popstate", route);
setUpDemo();
api.subscribe(onLiveEvent);
route();
</script>
